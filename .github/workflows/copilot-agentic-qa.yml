name: Agentic Code Quality Remediation

#on:
 
# pull_request_target:
#  branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:

# ---------------------------
# 1. STATIC ANALYSIS (PMD)
# ---------------------------
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Debug Java files
        run: |
          find . -name "*.java"

      - name: Run PMD
        # run: mvn pmd:pmd || true
        run: mvn pmd:pmd 

      - name: Debug PMD output
        run: |
          find target -name "*.xml"
      
      - name: Debug PMD XML content
        run: |
          echo "===== PMD XML ====="
          cat target/pmd.xml | head -50

      - name: Extract PMD issues
        run: |
          echo "PMD files:"
          find target -name "*.xml"

          if [ -f target/pmd.xml ]; then
            echo "Using target/pmd.xml"

            grep -i "violation" target/pmd.xml > pmd-issues.txt || true
          else
            echo "PMD report not found"
            touch pmd-issues.txt
          fi

          echo "==== PMD ISSUES ===="
          cat pmd-issues.txt
      - name: Extract readable PMD issues
        run: |
          echo "Extracting structured PMD issues..."

          grep "<violation" target/pmd.xml | \
          sed -E 's/.*rule="([^"]*)".*class="([^"]*)".*method="([^"]*)".*beginline="([^"]*)".*/Rule:\1 Class:\2 Method:\3 Line:\4/' \
          > pmd-readable.txt

          echo "==== PMD READABLE ===="
          cat pmd-readable.txt
      
      - name: Ensure PMD readable not empty
        run: |
            if [ ! -s pmd-readable.txt ]; then
                echo "No issues extracted" > pmd-readable.txt
            fi
      - name: Upload PMD issues
        uses: actions/upload-artifact@v4
        with:
          name: pmd-issues
          path: pmd-issues.txt
      
      - name: Collect Java code
        run: |
          find src/main/java -name "*.java" -exec cat {} \; > code.txt

      - name: Debug PMD pipeline
        run: |
          echo "==== RAW PMD ===="
          head -20 target/pmd.xml

          echo "==== READABLE ===="
          cat pmd-readable.txt

          echo "==== CODE ===="
          head -50 code.txt

      - name: Upload PMD readable issues
        uses: actions/upload-artifact@v4
        with:
          name: pmd-readable
          path: pmd-readable.txt
