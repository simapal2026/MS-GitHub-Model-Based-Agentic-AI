  fixer-agent:
    #runs-on: ubuntu-latest
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_COPILOT_TOKEN }}
    runs-on: self-hosted
    needs: static-analysis

    steps:
      - uses: actions/checkout@v4
    #instead of installing the tool , for self hosted check the installation  
    #  - name: Install tools
    #    run: |
    #      sudo apt-get update
    #      sudo apt-get install -y gh jq

    #  - name: Install Copilot CLI
    #    run: gh extension install github/gh-copilot || true

      - name: Verify tools
        run: |
          gh --version
          jq --version

    #  - name: Authenticate gh
    #    env:
    #      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #    run: |
    #      gh auth login --with-token < <(echo $GH_TOKEN)
    #      gh auth status

      - name: Download PMD issues
        uses: actions/download-artifact@v4
        with:
          name: pmd-issues
    
      - name: Download PMD readable issues
        uses: actions/download-artifact@v4
        with:
          name: pmd-readable
    
      - name: Debug downloaded files
        run: |
          ls -l
          cat pmd-readable.txt || echo "File missing"

      - name: Collect Java code
        run: |
          find src/main/java -name "*.java" -exec cat {} \; > code.txt
          echo "==== CODE FILE CREATED ===="
          wc -l code.txt
      - name: Verify Token Type
        run: |
          if [[ "$COPILOT_GITHUB_TOKEN" == github_pat_* ]]; then
            echo "✅ Fine-grained PAT detected"
          else
            echo "❌ Wrong token type"
            exit 1
          fi
      - name: Build Fix Prompt
        run: |
          cat << 'EOF' > fix.txt
          You are a Java code refactoring agent.
          TASK:
          Fix PMD violations in the given code.
          RULE:
          - Replace System.out.println with logger.info
          - Add Logger and LoggerFactory if missing
          STRICT OUTPUT FORMAT:
          - Output ONLY valid git diff
          - Do NOT explain anything
          - Do NOT add markdown
          - MUST start with: diff --git
          EXAMPLE:
          diff --git a/File.java b/File.java
          --- a/File.java
          +++ b/File.java
          @@
          - System.out.println("Hello");
          + logger.info("Hello");

          PMD VIOLATIONS:
          EOF

          cat pmd-readable.txt >> fix.txt
          echo -e "\nSOURCE CODE:\n" >> fix.txt
          cat code.txt >> fix.txt
      # Check status for self hosted without login from workflow
      - name: Verify Auth
        run: |
          gh auth status
          gh copilot status || true
      # Verify the installation status
      - name: Debug gh environment
        run: |
          which gh
          gh --version
          gh extension list || true
      # Install Copilot extension inside workflow
      - name: Install Copilot extension
        run: |
          gh extension install github/gh-copilot || true
      # Verify Installation
      - name: Verify Copilot
        run: |
          gh extension list
          gh copilot --version || true
      - name: Run Fixer
      # Not required for self hosted .Authenticate from Bash
      #  env:
    #      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #    GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          
          echo -e "\n=== Copilot Status ==="
          gh copilot --version 2>&1 || true
        
          echo -e "\n=== Auth Status ==="
          gh auth status 2>&1 || true
    
          echo -e "\n=== Prompt Validation ==="
          echo "Prompt size: $(wc -c < fix.txt) bytes"
          echo "Prompt lines: $(wc -l < fix.txt)"

    
          echo -e "\n=== Running Copilot Suggest ==="
          
          if command -v timeout >/dev/null 2>&1; then
            timeout 120s bash -c 'gh copilot -i suggest < fix.txt > fix.patch'
          elif command -v gtimeout >/dev/null 2>&1; then
            gtimeout 120s bash -c 'gh copilot -i suggest < fix.txt > fix.patch'
          else
            echo "No timeout command found, running without timeout"
            gh copilot -i suggest < fix.txt > fix.patch
          fi
          EXITCODE=$?
        
          if [ $EXITCODE -ne 0 ]; then
            echo "❌ Copilot exited with code: $EXITCODE"
            echo "=== Output ==="
            cat fix.patch
            exit $EXITCODE
          fi
    
          echo -e "\n=== Patch Output ==="
          if [ -s fix.patch ]; then
            echo "✓ Patch created ($(wc -c < fix.patch) bytes)"
            head -30 fix.patch
          else
            echo "✗ Patch is empty"
            exit 1
          fi

      - name: Validate Patch
        run: |
          if ! grep -q "diff --git" fix.patch; then
            echo "WARNING: Patch not valid"
          fi

      - name: Upload Fix Patch
        uses: actions/upload-artifact@v4
        with:
          name: fix-patch
          path: fix.patch

# ---------------------------
# 3. TEST GENERATION AGENT
# ---------------------------
  test-agent:
    runs-on: ubuntu-latest
    needs: fixer-agent

    steps:
      - uses: actions/checkout@v4

      - name: Install Copilot CLI
        run: |
          sudo apt-get install gh -y
          gh extension install github/gh-copilot || true

      - name: Authenticate gh
        run: echo "${{ secrets.MY_GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Collect Java Code
        run: |
          find src/main/java -name "*.java" -exec cat {} \; > code.txt

      - name: Prepare Test Prompt
        run: |
          echo "You are a Java test generator.
          STRICT RULES:
          - Output ONLY git diff
          - Use JUnit 5
          - Include imports
          - Include class name
          - Must start with diff --git" > test.txt
          cat code.txt >> test.txt

      - name: Run Test Generator
        run: |
          timeout 30s gh copilot suggest -p test.txt > test.patch || true

      - name: Validate Test Patch
        run: |
          grep "^diff" test.patch || echo "Invalid patch" > test.patch

      - name: Upload Test Patch
        uses: actions/upload-artifact@v4
        with:
          name: test-patch
          path: test.patch


# ---------------------------
# 4. PR AGENT (CRITICAL)
# ---------------------------
  pr-agent:
    runs-on: ubuntu-latest
    needs: test-agent

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download Fix Patch
        uses: actions/download-artifact@v4
        with:
          name: fix-patch
          path: patches/fix

      - name: Download Test Patch
        uses: actions/download-artifact@v4
        with:
          name: test-patch
          path: patches/test

      - name: Apply Patches
        run: |
          git apply patches/fix/fix.patch || echo "Fix patch failed"
          git apply patches/test/test.patch || echo "Test patch failed"

      - name: Ensure change exists
        run: echo "AI run ${{ github.run_id }}" >> ai-log.txt

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "AI: Code fixes and test generation" || echo "No changes"

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ai-remediation-${{ github.run_id }}
          base: ${{ github.head_ref }}
          title: "AI Remediation: Code Quality Fixes & Tests"
          body: |
            ## 🤖 AI Generated PR

            This PR includes:
            - PMD issue fixes
            - Generated unit tests

            Please review before merging.
          draft: false