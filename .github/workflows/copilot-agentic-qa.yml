name: Agentic AI Code Quality Pipeline

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:

# ---------------------------
# 1. STATIC ANALYSIS (PMD)
# ---------------------------
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Run PMD
        run: mvn pmd:pmd || true

      - name: Extract PMD issues
        run: |
          if [ -f target/pmd.xml ]; then
            grep "<violation" target/pmd.xml > pmd-readable.txt || true
          else
            echo "No PMD report" > pmd-readable.txt
          fi

          cat pmd-readable.txt

      - name: Upload PMD issues
        uses: actions/upload-artifact@v4
        with:
          name: pmd-readable
          path: pmd-readable.txt


# ---------------------------
# 2. COVERAGE AGENT (JACOCO)
# ---------------------------
  coverage-agent:
    runs-on: ubuntu-latest
    needs: static-analysis

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Run tests with coverage
        run: mvn test jacoco:report || true

      - name: Extract uncovered lines
        run: |
          grep -R "missed" target/site/jacoco > uncovered.txt || echo "No uncovered data" > uncovered.txt
          cat uncovered.txt

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: uncovered.txt


# ---------------------------
# 3. FIXER AGENT (AI)
# ---------------------------
  fixer-agent:
    runs-on: ubuntu-latest
    needs: static-analysis

    steps:
      - uses: actions/checkout@v4

      - name: Download PMD issues
        uses: actions/download-artifact@v4
        with:
          name: pmd-readable

      - name: Collect Java code
        run: |
          find src/main/java -name "*.java" -exec cat {} \; > code.txt

      - name: Build fix prompt
        run: |
          cat <<EOF > fix.txt
          You are a Java refactoring agent.

          TASK:
          Fix PMD violations.

          RULES:
          - Replace System.out.println with logger.info
          - Add Logger if missing
          - Do NOT change unrelated code

          OUTPUT:
          - ONLY valid git diff
          - MUST start with: diff --git

          PMD ISSUES:
          EOF

          cat pmd-readable.txt >> fix.txt
          echo -e "\nSOURCE CODE:\n" >> fix.txt
          head -2000 code.txt >> fix.txt

      - name: Build API request
        run: |
          PROMPT=$(jq -Rs . < fix.txt)

          cat <<EOF > request.json
          {
          "model": "gpt-4.1",
          "messages": [
          { "role": "user", "content": $PROMPT }
          ],
          "temperature": 0.2
          }
          EOF

      - name: Call GitHub Model API
        run: |
          curl -s https://models.inference.ai.azure.com/chat/completions \
            -H "Authorization: Bearer ${{ secrets.MY_MODEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json

          cat response.json

      - name: Extract patch
        run: |
          jq -r '.choices[0].message.content // empty' response.json > fix.patch
          cat fix.patch

      - name: Upload fix patch
        uses: actions/upload-artifact@v4
        with:
          name: fix-patch
          path: fix.patch


# ---------------------------
# 4. TEST AGENT (COVERAGE-AWARE AI)
# ---------------------------
  test-agent:
    runs-on: ubuntu-latest
    needs: [fixer-agent, coverage-agent]

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data

      - name: Collect Java code
        run: |
          find src/main/java -name "*.java" -exec cat {} \; > code.txt

      - name: Build test prompt
        run: |
          cat <<EOF > test.txt
          You are a senior Java test engineer.

          TASK:
          Generate JUnit 5 tests ONLY for uncovered code.

          RULES:
          - Focus on uncovered logic
          - No duplicate tests
          - Output ONLY git diff
          - MUST start with diff --git

          UNCOVERED:
          EOF

          cat uncovered.txt >> test.txt
          echo -e "\nSOURCE CODE:\n" >> test.txt
          head -2000 code.txt >> test.txt

      - name: Build API request
        run: |
          PROMPT=$(jq -Rs . < test.txt)

          cat <<EOF > request.json
          {
          "model": "gpt-4.1",
          "messages": [
          { "role": "user", "content": $PROMPT }
          ]
          }
          EOF

      - name: Call Model API
        run: |
          curl -s https://models.inference.ai.azure.com/chat/completions \
            -H "Authorization: Bearer ${{ secrets.MY_MODEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json

          cat response.json

      - name: Extract test patch
        run: |
          jq -r '.choices[0].message.content // empty' response.json > test.patch
          cat test.patch

      - name: Upload test patch
        uses: actions/upload-artifact@v4
        with:
          name: test-patch
          path: test.patch

# ---------------------------
# 5. PR AGENT
# ---------------------------
  pr-agent:
    runs-on: ubuntu-latest
    needs: test-agent

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download patches
        uses: actions/download-artifact@v4
        with:
          name: fix-patch
          path: patches/fix

      - name: Apply patches safely
        run: |
          git apply --reject --whitespace=fix patches/fix-patch/fix.patch || true
          git apply --reject --whitespace=fix patches/test-patch/test.patch || true

      - name: Ensure change exists
        run: echo "AI run ${{ github.run_id }}" >> ai-log.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "AI: Code quality fixes + coverage tests" || echo "No changes"

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ai-remediation-${{ github.run_id }}
          base: ${{ github.head_ref }}
          title: "AI Remediation: Quality Fixes + Coverage Tests"
          body: |
            ## 🤖 AI Generated PR

            Includes:
            - PMD fixes
            - Coverage-driven test cases

            Please review before merging.
          draft: false
            