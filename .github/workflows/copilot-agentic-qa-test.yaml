      - name: Call GitHub Model API
        run: |
          PROMPT=$(jq -Rs . < fix.txt)
          RESPONSE=$(curl https://models.inference.ai.azure.com/chat/completions \
          -H "Authorization: Bearer ${{ secrets.MY_GITHUB_COPILOT_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d "{
           \"model\": \"gpt-4.1\",
           \"messages\": [
           {\"role\": \"user\", \"content\": $PROMPT}
           ],
           \"temperature\": 0.2
           }")

          echo "==== RAW RESPONSE ===="
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -r '.choices[0].message.content' > fix.patch

          echo "=== PATCH OUTPUT ==="
          cat fix.patch

      - name: Validate Patch
        run: |
          if ! grep -q "diff --git" fix.patch; then
            echo "WARNING: Patch not valid"
          fi

      - name: Upload Fix Patch
        uses: actions/upload-artifact@v4
        with:
          name: fix-patch
          path: fix.patch

# ---------------------------
# 3. TEST GENERATION AGENT
# ---------------------------
  test-agent:
    runs-on: ubuntu-latest
    needs: fixer-agent

    steps:
      - uses: actions/checkout@v4

      - name: Download code context
        uses: actions/download-artifact@v4
        with:
          name: pmd-readable

      - name: Collect Java code
        run: |
          echo "Collecting Java files..."

          find src/main/java -name "*.java" -exec cat {} \; > code.txt

          echo "=== CODE SIZE ==="
          wc -l code.txt

      - name: Build test prompt
        run: |
          echo "Building prompt..."

          cat <<EOF > test.txt
          You are a Java unit test generator.

          TASK:
          Generate JUnit 5 test cases for the given code.

          STRICT RULES:
          - Output ONLY valid git diff
          - MUST start with: diff --git
          - Include imports
          - Include full test class
          - Do NOT explain anything

          If tests already exist, improve coverage.

          EOF

          # Limit size to avoid LLM failure
          head -2000 code.txt >> test.txt

          echo "=== PROMPT PREVIEW ==="
          head -50 test.txt

      - name: Build API request
        run: |
          echo "Preparing JSON payload..."

          PROMPT=$(jq -Rs . < test.txt)

          cat <<EOF > request.json
          {
          "model": "gpt-4.1",
          "messages": [
          {
          "role": "user",
          "content": $PROMPT
          }
          ],
          "temperature": 0.2
          }
          EOF

          echo "=== REQUEST PREVIEW ==="
          cat request.json | head -20

      - name: Call GitHub Model API
        run: |
          echo "Calling GitHub Models API..."

          curl -s https://models.inference.ai.azure.com/chat/completions \
          -H "Authorization: Bearer ${{ secrets.MY_GITHUB_COPILOT_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d @request.json > response.json

          echo "=== RAW RESPONSE ==="
          cat response.json
      
      - name: Extract test patch
        run: |
          echo "Extracting patch..."

          jq -r '.choices[0].message.content // empty' response.json > test.patch

          echo "=== PATCH OUTPUT ==="
          cat test.patch

      - name: Validate test patch
        run: |
          if ! grep -q "diff --git" test.patch; then
          echo "❌ Invalid or empty patch"
          exit 1
          fi

      - name: Upload Test Patch
        uses: actions/upload-artifact@v4
        with:
          name: test-patch
          path: test.patch

# ---------------------------
# 4. PR AGENT (CRITICAL)
# ---------------------------
  pr-agent:
    runs-on: ubuntu-latest
    needs: test-agent

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download Fix Patch
        uses: actions/download-artifact@v4
        with:
          name: fix-patch
          path: patches/fix

      - name: Download Test Patch
        uses: actions/download-artifact@v4
        with:
          name: test-patch
          path: patches/test

      - name: Apply Patches
        run: |
          git apply patches/fix/fix.patch || echo "Fix patch failed"
          git apply patches/test/test.patch || echo "Test patch failed"

      - name: Ensure change exists
        run: echo "AI run ${{ github.run_id }}" >> ai-log.txt

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "AI: Code fixes and test generation" || echo "No changes"

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ai-remediation-${{ github.run_id }}
          base: ${{ github.head_ref }}
          title: "AI Remediation: Code Quality Fixes & Tests"
          body: |
            ## 🤖 AI Generated PR

            This PR includes:
            - PMD issue fixes
            - Generated unit tests

            Please review before merging.
          draft: false